<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ms-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1A2644" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="ms-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DB" />
      <stop offset="25%" stop-color="#F5D77F" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7820" />
    </linearGradient>

    <!-- High-specular gold highlight -->
    <linearGradient id="ms-gold-hi" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59A27" />
      <stop offset="50%" stop-color="#FFF2B2" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Dynamic Orbital Ring Gradient -->
    <linearGradient id="ms-orbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9E7820" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Squircle Background with Gold Rim -->
  <rect width="118" height="118" x="1" y="1" rx="27" fill="url(#ms-bg-grad)" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="2" />

  <!-- Back Orbital Arc -->
  <path
    d="M 104 26 C 100 14, 84 17, 60 32 C 36 47, 18 69, 13 90"
    fill="none"
    stroke="url(#ms-orbit)"
    stroke-width="1.4"
    stroke-dasharray="3.5 2.5"
    opacity="0.4"
  />

  <!-- Circuit traces & neural network dots on left stem -->
  <path d="M 34 38 L 22 38 L 16 32" stroke="url(#ms-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 34 52 L 18 52" stroke="url(#ms-gold)" stroke-width="2" stroke-linecap="round" />
  <path d="M 34 68 L 24 78 L 15 78" stroke="url(#ms-gold)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Nodes -->
  <circle cx="16" cy="32" r="2.8" fill="url(#ms-gold)" />
  <circle cx="16" cy="32" r="1.4" fill="#FFFDF0" />
  <circle cx="18" cy="52" r="2.8" fill="url(#ms-gold)" />
  <circle cx="18" cy="52" r="1.4" fill="#FFFDF0" />
  <circle cx="15" cy="78" r="2.8" fill="url(#ms-gold)" />
  <circle cx="15" cy="78" r="1.4" fill="#FFFDF0" />

  <!-- Solder junctions -->
  <circle cx="34" cy="38" r="1.8" fill="url(#ms-gold-hi)" />
  <circle cx="34" cy="52" r="1.8" fill="url(#ms-gold-hi)" />
  <circle cx="34" cy="68" r="1.8" fill="url(#ms-gold-hi)" />

  <!-- Letter M -->
  <path
    d="M 34 84 L 34 36 L 50 62 L 66 36 L 66 84"
    fill="none"
    stroke="url(#ms-gold)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Letter S -->
  <path
    d="M 96 44 C 96 38, 89 35, 83 35 C 75 35, 71 40, 71 47 C 71 58, 97 60, 97 73 C 97 81, 91 85, 83 85 C 75 85, 70 81, 70 75"
    fill="none"
    stroke="url(#ms-gold)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Front Orbital Ring -->
  <path
    d="M 13 90 C 15 102, 34 103, 58 89 C 82 75, 98 52, 105 25"
    fill="none"
    stroke="url(#ms-orbit)"
    stroke-width="2.5"
    stroke-linecap="round"
  />

  <!-- Star Spark at Top-Right -->
  <path
    d="M 105 15 Q 105 25, 115 25 Q 105 25, 105 35 Q 105 25, 95 25 Q 105 25, 105 15 Z"
    fill="url(#ms-gold-hi)"
  />
  <circle cx="105" cy="25" r="2.2" fill="#FFFFFF" />
</svg>
